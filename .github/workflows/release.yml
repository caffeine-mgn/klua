# Tag-triggered: any pushed tag of the form N.N.N (or N.N.N-suffix) starts
# a Sonatype Central publish. Workflow expects GITHUB_REF_NAME to be the
# tag itself so build.gradle.kts can pick it up as the project version.
#
# Conventions mirror the rest of the caffeine-mgn/* repos (ksqlite,
# kdns, kn-clang-compiler-plugin): `ubuntu-latest` runner, GPG key
# imported into the system keyring once at job start, the
# `signingUseGpg` flag in build.gradle.kts flips the build over to
# `useGpgCmd()`, and the Sonatype user token plus GPG key id /
# passphrase are forwarded as `-PmavenCentral*` / `-Psigning.gnupg.*`
# Gradle properties.
#
# JDK distribution is intentionally `temurin` (Adoptium OpenJDK 21),
# not Liberica: this project's JVM JNI binding crashes inside
# `getgeneric` under Liberica 21.0.6, and OpenJDK 21.0.11+ is the
# supported test/production runtime.
#
# Tests are run as a pre-publish gate. jvmTest is the cheap JVM-side
# coverage; linuxX64Test exercises the Kotlin/Native Lua path. Both
# are required to be green before any commit is considered complete
# (see klua project memory).

name: Release to Maven Central

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # AGP needs an Android SDK with compileSdk 35 to build the klua-android
      # AAR; the runner image's SDK may lag behind, so install the platform and
      # build-tools explicitly. ubuntu-latest already provides the SDK and
      # cmdline-tools, so we drive sdkmanager directly (the setup-android
      # action is incompatible with the newer preinstalled sdkmanager 16.x).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # klua links Lua 5.4 (src/nativeMain/lua/*.c) into every native
      # klib via clangBuildStatic, and on the JVM clangBuildDynamic
      # produces the .so that NativeLoader extracts at runtime. Linux
      # toolchain packages are needed for both: gcc/clang for the
      # plugin and mingw-w64 for the cross-compiled Windows .dll.
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang mingw-w64

      # The GPG private key is stored in GitHub secrets with literal
      # `\n` escapes (one-line encoding). `printf '%b'` interprets
      # those escapes; the import is non-interactive
      # (`--batch --pinentry-mode loopback`) and we let the agent know
      # it's allowed to use the loopback pinentry.
      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          printf '%b' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

      # Pre-publish gate: jvmTest (JNI Lua path + limit control core) and
      # linuxX64Test (Kotlin/Native Lua path) must be green. Anything less
      # aborts the release.
      #
      # Konan pre-fetch is done as a plain shell step (not via
      # `./gradlew downloadKonan`): kn-clang 0.0.7's `downloadKonan`
      # task is non-blocking on CI — it kicks off the unpacked
      # download and returns within seconds even though the
      # tarball hasn't finished downloading, leaving
      # `~/.konan/.../konan/konan.properties` missing for
      # downstream `downloadKonanToolchain*` tasks. Doing the
      # download + extract here directly guarantees
      # `konan.properties` exists before kn-clang's toolchain tasks
      # try to read it.
      #
      # The asset name is `kotlin-native-prebuilt-linux-x86_64-2.4.20.tar.gz`
      # (the legacy non-`-prebuilt` URL 404s on the v2.4.20 GitHub
      # release).
      - name: Pre-fetch Kotlin/Native
        run: |
          set -euo pipefail
          KONAN_VERSION="2.4.20"
          KONAN_DIR="$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-${KONAN_VERSION}"
          if [ ! -f "${KONAN_DIR}/konan/konan.properties" ]; then
            echo "Downloading kotlin-native-prebuilt-linux-x86_64-${KONAN_VERSION}.tar.gz"
            mkdir -p "${KONAN_DIR}"
            curl -fsSL \
              "https://github.com/JetBrains/kotlin/releases/download/v${KONAN_VERSION}/kotlin-native-prebuilt-linux-x86_64-${KONAN_VERSION}.tar.gz" \
              | tar -xz --strip-components=1 -C "${KONAN_DIR}"
          fi
          ls "${KONAN_DIR}/konan/konan.properties"

      - name: Pre-fetch cross toolchains
        run: ./gradlew downloadKonanToolchainLinux_arm64 downloadKonanToolchainMingw_x64 --stacktrace

      - name: Run JVM and native tests
        run: ./gradlew jvmTest linuxX64Test --stacktrace

      # Package the Android AAR and assert its native libraries are real
      # Android/bionic binaries. A regression that links them against GLIBC
      # (e.g. a host-target mix-up) produces a .so that loads on desktop but
      # crashes on every device, so this gate runs before publishing.
      - name: Build Android AAR and verify ABI
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace
          rm -rf /tmp/aar-so && mkdir -p /tmp/aar-so
          unzip -o -q build/outputs/aar/klua-release.aar 'jni/*' -d /tmp/aar-so
          export LC_ALL=C
          fail=0
          for so in /tmp/aar-so/jni/*/libklua.so; do
            echo "== $so"
            readelf -d "$so" | grep NEEDED || true
            # glibc's SONAME is libc.so.6; bionic's is libc.so.
            if readelf -d "$so" | grep -q 'libc\.so\.6'; then
              echo "ERROR: $so links against glibc (libc.so.6), not an Android/bionic binary"
              fail=1
            fi
            if ! readelf -d "$so" | grep -q 'libc\.so'; then
              echo "ERROR: $so has no bionic libc.so dependency"
              fail=1
            fi
          done
          exit $fail

      - name: Repository hygiene (no build outputs tracked)
        run: test "$(git ls-files | grep -cE '^(build|\.gradle)/')" = "0"

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USENAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}
