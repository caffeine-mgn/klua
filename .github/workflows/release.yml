# Tag-triggered: any pushed tag of the form N.N.N (or N.N.N-suffix) starts
# a Sonatype Central publish. Workflow expects GITHUB_REF_NAME to be the
# tag itself so build.gradle.kts can pick it up as the project version.
#
# Conventions mirror the rest of the caffeine-mgn/* repos (ksqlite,
# kdns, kn-clang-compiler-plugin): `ubuntu-latest` runner, GPG key
# imported into the system keyring once at job start, the
# `signingUseGpg` flag in build.gradle.kts flips the build over to
# `useGpgCmd()`, and the Sonatype user token plus GPG key id /
# passphrase are forwarded as `-PmavenCentral*` / `-Psigning.gnupg.*`
# Gradle properties.
#
# JDK distribution is intentionally `temurin` (Adoptium OpenJDK 21),
# not Liberica: this project's JVM JNI binding crashes inside
# `getgeneric` under Liberica 21.0.6, and OpenJDK 21.0.11+ is the
# supported test/production runtime.
#
# Tests are run as a pre-publish gate. jvmTest is the cheap JVM-side
# coverage; linuxX64Test exercises the Kotlin/Native Lua path. Both
# are required to be green before any commit is considered complete
# (see klua project memory).

name: Release to Maven Central

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # klua links Lua 5.4 (src/nativeMain/lua/*.c) into every native
      # klib via clangBuildStatic, and on the JVM clangBuildDynamic
      # produces the .so that NativeLoader extracts at runtime. Linux
      # toolchain packages are needed for both: gcc/clang for the
      # plugin and mingw-w64 for the cross-compiled Windows .dll.
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang mingw-w64

      # The GPG private key is stored in GitHub secrets with literal
      # `\n` escapes (one-line encoding). `printf '%b'` interprets
      # those escapes; the import is non-interactive
      # (`--batch --pinentry-mode loopback`) and we let the agent know
      # it's allowed to use the loopback pinentry.
      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          printf '%b' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

      # Pre-publish gate: jvmTest must be 25/25 and linuxX64Test must
      # be 18/18 green. Anything less aborts the release.
      #
      # kn-clang 0.0.7's `downloadKonan` task already pulls the correct
      # `kotlin-native-prebuilt-linux-x86_64-2.4.20.tar.gz` asset
      # (the legacy non-`-prebuilt` URL 404s for 2.4.20+), and the
      # `downloadKonanToolchain*` tasks chain automatically. Earlier
      # versions (≤0.0.6) had to be worked around with a manual
      # pre-fetch step; that hack is no longer needed.
      - name: Run JVM and native tests
        run: ./gradlew downloadKonan downloadKonanToolchainLinux_arm64 downloadKonanToolchainMingw_x64 jvmTest linuxX64Test --stacktrace

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USENAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}
