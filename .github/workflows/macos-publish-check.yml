# TEMPORARY validation workflow for the macOS release host.
#
# Mirrors the `publish` job from release.yml (macOS universal host: build every
# Kotlin/Native target, the JVM host native libraries for all supported OSes
# and the Android AAR) but finishes with `publishToMavenLocal` instead of a
# Sonatype Central upload, so it is safe to run on a feature branch.
#
# Delete this file once the macOS host change has been validated by a real tag
# release.

name: macOS publish check (temporary)

on:
  push:
    branches:
      - ci/macos-host

env:
  KONAN_VERSION: "2.4.20"
  # Fixed version for the dry run (the real release takes it from the tag).
  VERSION_OVERRIDE: "0.0.0-maccheck"

jobs:
  macos-check:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pre-fetch Kotlin/Native (macOS arm64)
        run: |
          set -euo pipefail
          KONAN_DIR="$HOME/.konan/kotlin-native-prebuilt-macos-aarch64-${KONAN_VERSION}"
          if [ ! -f "${KONAN_DIR}/konan/konan.properties" ]; then
            mkdir -p "${KONAN_DIR}"
            curl -fsSL \
              "https://github.com/JetBrains/kotlin/releases/download/v${KONAN_VERSION}/kotlin-native-prebuilt-macos-aarch64-${KONAN_VERSION}.tar.gz" \
              | tar -xz --strip-components=1 -C "${KONAN_DIR}"
          fi
          ls "${KONAN_DIR}/konan/konan.properties"

      - name: Pre-fetch cross toolchains
        run: >-
          ./gradlew
          downloadKonanToolchainLinux_x64
          downloadKonanToolchainLinux_arm64
          downloadKonanToolchainMingw_x64
          --stacktrace

      - name: Provision cross JNI headers (linux/win32 jni_md.h)
        run: |
          set -euo pipefail
          mkdir -p build/jni-include/linux build/jni-include/win32
          curl -fsSL "https://raw.githubusercontent.com/openjdk/jdk21u/master/src/java.base/unix/native/include/jni_md.h" \
            -o build/jni-include/linux/jni_md.h
          curl -fsSL "https://raw.githubusercontent.com/openjdk/jdk21u/master/src/java.base/windows/native/include/jni_md.h" \
            -o build/jni-include/win32/jni_md.h
          ls -l build/jni-include/*/jni_md.h

      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          command -v gpg >/dev/null 2>&1 || brew install gnupg
          printf '%b' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

      - name: Run JVM and macOS native tests
        run: |
          set -euo pipefail
          ./gradlew jvmTest macosArm64Test -Pversion="$VERSION_OVERRIDE" --stacktrace
          echo "== build/libs right after the test run =="
          ls -la build/libs || true

      - name: Verify JVM jar carries every host native library
        run: |
          set -euo pipefail
          ./gradlew jvmJar -Pversion="$VERSION_OVERRIDE" --stacktrace
          echo "== pwd =="; pwd
          echo "== build/libs =="; ls -la build/libs || true
          JAR="$(find build -type f -name 'klua-jvm-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          if [ -z "$JAR" ]; then
            echo "ERROR: no JVM jar found; jars under build/:"
            find build -name '*.jar' | head -20
            exit 1
          fi
          echo "jar: $JAR"
          rm -rf /tmp/jar-payload && mkdir -p /tmp/jar-payload
          unzip -o -q "$JAR" -d /tmp/jar-payload
          fail=0
          for entry in linux_x64/libklua.so linux_arm64/libklua.so mingw_x64/libklua.dll macos_arm64/libklua.dylib; do
            path="/tmp/jar-payload/$entry"
            if [ ! -f "$path" ]; then
              echo "ERROR: missing $entry"
              fail=1
              continue
            fi
            echo "== $entry"
            file "$path"
          done
          file /tmp/jar-payload/linux_x64/libklua.so  | grep -q 'ELF 64-bit' || { echo "ERROR: linux_x64 payload is not ELF"; fail=1; }
          file /tmp/jar-payload/linux_arm64/libklua.so | grep -q 'ELF 64-bit' || { echo "ERROR: linux_arm64 payload is not ELF"; fail=1; }
          file /tmp/jar-payload/macos_arm64/libklua.dylib | grep -q 'Mach-O'     || { echo "ERROR: macos_arm64 payload is not Mach-O"; fail=1; }
          file /tmp/jar-payload/mingw_x64/libklua.dll     | grep -qE 'PE32|MS Windows' || { echo "ERROR: mingw_x64 payload is not a PE binary"; fail=1; }
          exit $fail

      - name: Build Android AAR
        run: ./gradlew assembleRelease -Pversion="$VERSION_OVERRIDE" --stacktrace

      - name: Publish to Maven Local (dry run of the release graph)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal -Pversion="$VERSION_OVERRIDE" \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD"

      - name: Publish payload summary
        run: |
          set -euo pipefail
          echo "== published files =="
          find ~/.m2/repository/pw/binom -name '*0.0.0-maccheck*' -type f | sed "s|$HOME/.m2/repository/||" | sort
