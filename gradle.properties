kotlin.code.style=official
# Deprecated no-ops under the Kotlin/Native new memory model (the default since
# 1.7): the `-memory-model`/`freezing` switches were removed, so these only
# produced build warnings (AUDIT-2026-10-12.md #11).
# kotlin.mpp.enableCInteropCommonization stays: the shared posixMain source set
# consumes the per-target `lua` cinterop, which needs commonization.
kotlin.mpp.enableCInteropCommonization=true
# Hide the "target cannot be built on this host" warnings for the Apple/Windows
# targets that are only built on the matching release runners.
kotlin.native.ignoreDisabledTargets=true
# The source-set hierarchy is wired explicitly (posixMain / jvmSharedMain and the
# per-family targets), so the automatic default template only produced the
# "Default Kotlin Hierarchy Template Not Applied Correctly" warning.
kotlin.mpp.applyDefaultHierarchyTemplate=false
org.gradle.jvmargs=-Xmx4096M
org.gradle.parallel=true
